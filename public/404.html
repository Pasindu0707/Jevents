<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>J Events</title>
    <!--
      GitHub Pages has no server-side routing. For client-side routes like
      /Jevents/<slug>, GitHub serves this 404 page; this script re-encodes the
      path into a query string and redirects to the app, which restores it
      (see the matching script in index.html). pathSegmentsToKeep = 1 keeps the
      "/Jevents" project base. https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
