<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="assets/logos/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J Events Wedding & Event Management Platform</title>
    <meta
      name="description"
      content="Manage weddings and events smarter with J Events guest management, vendor coordination, timelines, and analytics for celebrations across Sri Lanka."
    />
    <meta name="theme-color" content="#637953" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="J Events Wedding & Event Management Platform" />
    <meta
      property="og:description"
      content="Create, organize, and track weddings and celebrations with real time guest management and premium coordination."
    />
    <meta property="og:image" content="assets/photos/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Raleway:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Couple invite page fonts (ported from Project B / Invitely): script and
         serif/sans families used by the section templates and per-couple data. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Pinyon+Script&family=Dancing+Script:wght@400;500;600;700&family=Allura&family=Montserrat:wght@300;400;500;600&family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "J Events",
        "description": "Wedding and event management studio in Sri Lanka",
        "url": "https://jevents.example",
        "email": "jevents.officials@gmail.com",
        "telephone": "+94772281154",
        "sameAs": [
          "https://www.facebook.com/profile.php?id=61589323568455",
          "https://www.instagram.com/j__events_/",
          "https://www.tiktok.com/@j__events_"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Wennappuwa",
          "addressCountry": "LK"
        }
      }
    </script>
    <script>
      ;(() => {
        try {
          const mode = localStorage.getItem('jevents.theme') || 'system'
          const systemDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          const resolved = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode
          if (resolved === 'dark') document.documentElement.classList.add('dark')
        } catch {}
      })()
    </script>
  </head>
  <body>
    <!-- Restores the real path after the GitHub Pages 404.html SPA redirect.
         Must run before the app mounts. https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
